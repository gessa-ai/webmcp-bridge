<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gessa WebMCP Bridge Reference</title>
    <style>
      :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #090b12; color: #f4f5fb; }
      main { width: min(42rem, calc(100vw - 3rem)); padding: 2rem; border: 1px solid #2e3448; border-radius: 1rem; background: #111522; }
      h1 { margin-top: 0; }
      code { color: #9fe8cc; }
      .actions { display: flex; flex-wrap: wrap; gap: .75rem; }
      button { padding: .7rem 1rem; border: 0; border-radius: .6rem; background: #7ce3bd; color: #07110d; font: inherit; font-weight: 700; cursor: pointer; }
      button.secondary { background: #252b3d; color: #f4f5fb; }
      [data-status="unsupported"] { color: #f4bd72; }
      [data-status="ready"] { color: #9fe8cc; }
    </style>
  </head>
  <body>
    <main>
      <h1>Gessa WebMCP Bridge Reference</h1>
      <p>This standalone page exercises the public bridge without the Gessa engine.</p>
      <p>Status: <strong id="status">starting</strong></p>
      <p>Counter: <strong id="counter">0</strong></p>
      <div class="actions">
        <button id="manual-increment" type="button">Increment manually</button>
        <button class="secondary" id="dispose" type="button">Unregister tools</button>
      </div>
      <p><small>Use the browser's Site tools inspector to call <code>reference_read_counter</code> or <code>reference_increment_counter</code>.</small></p>
    </main>
    <script type="module" src="./reference.js"></script>
  </body>
</html>
